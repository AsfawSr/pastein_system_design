server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pastebin}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jpa:
    hibernate:
      ddl-auto: validate

pastebin:
  jwt:
    # no default on purpose: prod must fail fast without a real secret
    secret: ${PASTEBIN_JWT_SECRET}

management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: info
    com.asfaw.pastebin: info
