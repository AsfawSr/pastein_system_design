<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pastebin — New paste</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1><a th:href="@{/}">Pastebin</a></h1>
    <nav>
        <a th:href="@{/public}">Public pastes</a>
        <span th:if="${username == null}">
            <a th:href="@{/login}">Login</a>
            <a th:href="@{/register}">Register</a>
        </span>
        <span th:if="${username != null}" class="userbox">
            <span th:text="${username}">user</span>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="linklike">Logout</button>
            </form>
        </span>
    </nav>
</header>
<main>
    <form th:action="@{/paste}" th:object="${form}" method="post">
        <label for="title">Title (optional)</label>
        <input id="title" type="text" th:field="*{title}" placeholder="Untitled">
        <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">title error</p>

        <label for="content">Content</label>
        <textarea id="content" th:field="*{content}" rows="16"
                  placeholder="Paste your text here..."></textarea>
        <p class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">content error</p>

        <label for="language">Language</label>
        <select id="language" th:field="*{language}">
            <option th:each="lang : ${languages}" th:value="${lang}" th:text="${lang}">plaintext</option>
        </select>

        <label for="expiry">Expires</label>
        <select id="expiry" th:field="*{expiry}">
            <option th:each="opt : ${T(com.asfaw.pastebin.paste.web.ExpiryOption).values()}"
                    th:value="${opt}" th:text="${opt.label}">Never</option>
        </select>

        <label for="visibility">Visibility</label>
        <select id="visibility" th:field="*{visibility}">
            <option th:value="${T(com.asfaw.pastebin.paste.PasteVisibility).UNLISTED}">Unlisted (only people with the link)</option>
            <option th:value="${T(com.asfaw.pastebin.paste.PasteVisibility).PUBLIC}">Public (listed on the public page)</option>
        </select>

        <label class="checkbox">
            <input type="checkbox" th:field="*{burnAfterRead}">
            Burn after read (paste is destroyed after the first view)
        </label>

        <label for="password">Password (optional)</label>
        <input id="password" type="password" th:field="*{password}"
               placeholder="Leave empty for no password">
        <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">password error</p>

        <button type="submit">Create paste</button>
    </form>
</main>
</body>
</html>
