<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Public pastes — Pastebin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1><a th:href="@{/}">Pastebin</a></h1>
</header>
<main>
    <h2>Recent public pastes</h2>
    <form th:action="@{/search}" method="get" class="searchbar">
        <input type="search" name="q" placeholder="Search public pastes...">
        <button type="submit">Search</button>
    </form>
    <p th:if="${pastes.isEmpty()}">Nothing here yet — <a th:href="@{/}">create the first public paste</a>.</p>
    <table th:unless="${pastes.isEmpty()}">
        <thead>
        <tr>
            <th>Title</th>
            <th>Created (UTC)</th>
            <th>Views</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pastes.content}">
            <td><a th:href="@{/p/{id}(id=${p.id})}"
                   th:text="${p.title != null ? p.title : 'Untitled'}">title</a></td>
            <td th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}">created</td>
            <td th:text="${p.views}">0</td>
        </tr>
        </tbody>
    </table>
    <nav class="pager" th:unless="${pastes.isEmpty()}">
        <a th:if="${pastes.hasPrevious()}" th:href="@{/public(page=${pastes.number - 1})}">&laquo; Newer</a>
        <span th:text="'Page ' + ${pastes.number + 1} + ' of ' + ${pastes.totalPages}">page</span>
        <a th:if="${pastes.hasNext()}" th:href="@{/public(page=${pastes.number + 1})}">Older &raquo;</a>
    </nav>
    <p><a th:href="@{/}">+ New paste</a></p>
</main>
</body>
</html>
