<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Protected paste — Pastebin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1><a th:href="@{/}">Pastebin</a></h1>
</header>
<main>
    <h2>This paste is password-protected</h2>
    <p class="error" th:if="${wrongAttempt}">Wrong password, try again.</p>
    <form th:action="@{/p/{id}/unlock(id=${pasteId})}" method="post">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autofocus>
        <button type="submit">Unlock</button>
    </form>
</main>
</body>
</html>
