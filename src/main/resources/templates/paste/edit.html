<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit paste — Pastebin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1><a th:href="@{/}">Pastebin</a></h1>
    <nav><a th:href="@{/mine}">My pastes</a></nav>
</header>
<main>
    <h2>Edit paste</h2>
    <form th:action="@{/p/{id}/edit(id=${pasteId})}" th:object="${form}" method="post">
        <label for="title">Title (optional)</label>
        <input id="title" type="text" th:field="*{title}" placeholder="Untitled">
        <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">title error</p>

        <label for="content">Content</label>
        <textarea id="content" th:field="*{content}" rows="16"></textarea>
        <p class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">content error</p>

        <label for="language">Language</label>
        <select id="language" th:field="*{language}">
            <option th:each="lang : ${languages}" th:value="${lang}" th:text="${lang}">plaintext</option>
        </select>

        <button type="submit">Save changes</button>
    </form>
</main>
</body>
</html>
