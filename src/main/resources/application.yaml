spring:
  application:
    name: pastebin
  datasource:
    url: jdbc:postgresql://localhost:5432/pastebin
    username: pastebin
    password: pastebin
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cache:
    type: redis
    cache-names: pastes
    redis:
      time-to-live: 10m
  data:
    redis:
      host: localhost
      port: 6379

pastebin:
  cleanup:
    interval: PT10M
  rate-limit:
    capacity: 10
    refill-per-minute: 10
  jwt:
    # dev-only secret; override via PASTEBIN_JWT_SECRET in production
    secret: dev-only-secret-change-me-0123456789abcdef
    ttl: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
