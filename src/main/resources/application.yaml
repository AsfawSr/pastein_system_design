spring:
  application:
    name: pastebin
  datasource:
    url: jdbc:postgresql://localhost:5432/pastebin
    username: pastebin
    password: pastebin
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

pastebin:
  cleanup:
    interval: PT10M
  rate-limit:
    capacity: 10
    refill-per-minute: 10
