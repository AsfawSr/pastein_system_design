spring:
  application:
    name: pastebin
  datasource:
    url: jdbc:postgresql://localhost:5432/pastebin
    username: pastebin
    password: pastebin
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cache:
    cache-names: pastes
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m,recordStats

pastebin:
  cleanup:
    interval: PT10M
  rate-limit:
    capacity: 10
    refill-per-minute: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
